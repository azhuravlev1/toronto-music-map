<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Live music venues in Toronto with the next three weeks of shows, on a TTC + GO transit map.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>">
  <title>Toronto Live Music Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>Toronto Live</h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <input id="search" type="search" placeholder="Find a venue…" autocomplete="off">
    <ul id="search-results"></ul>
  </header>

  <aside class="legend" id="legend">
    <div class="legend-head">
      <span>Colour venues by</span>
      <button class="legend-toggle" id="legend-toggle" title="Collapse">–</button>
    </div>
    <div class="legend-body">
      <div class="seg" id="mode">
        <button data-mode="next" class="on">Next show</button>
        <button data-mode="busy">This week</button>
        <button data-mode="type">Type</button>
      </div>
      <ul class="legend-items" id="legend-items"></ul>
      <p class="legend-note">Dot size = capacity</p>
      <div class="legend-transit" id="legend-transit"></div>
    </div>
  </aside>

  <section class="card" id="card" hidden></section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
  <script src="data/transit.js"></script>
  <script src="data/venues.js"></script>
  <script src="data/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
